<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>GE Control V3</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f4f7;margin:0;color:#101828}
header{background:#0b1220;color:#fff;padding:18px}main{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:15px;margin-bottom:12px}
select,input,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #ccd2da;box-sizing:border-box;width:100%;margin:4px 0}
button{background:#175cd3;color:#fff;border:0;font-weight:700}.stop{background:#d92d20}.muted{color:#667085;font-size:13px}.metric{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}
#app{display:none}.error{background:#fee4e2;color:#b42318;padding:10px;border-radius:10px}
</style>
</head>
<body>
<header><b>⚙️ GE Control V3</b><div class="muted">Version test connectée à Supabase</div></header>

<div id="login" style="max-width:420px;margin:30px auto;padding:15px">
<div class="card"><h2>Connexion technicien</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Mot de passe">
<button onclick="login()">Se connecter</button>
<button style="background:#475467" onclick="signup()">Créer le compte technicien</button>
<div id="msg"></div>
</div></div>

<div id="app"><main>
<div class="card"><button style="background:#475467" onclick="logout()">Se déconnecter</button></div>

<div class="card"><h2>⚡ Démarrage / arrêt</h2>
<label>Site</label><select id="site" onchange="loadGroups()"></select>
<label>Groupe</label><select id="group"></select>
<div id="state"></div>
</div>

<div class="card"><h2>📝 Relevé</h2>
<input id="hours" type="number" step=".1" placeholder="Heures moteur">
<input id="rpm" type="number" placeholder="Régime tr/min">
<input id="voltage" type="number" placeholder="Tension V">
<input id="freq" type="number" step=".1" placeholder="Fréquence Hz">
<input id="oil" type="number" step=".1" placeholder="Pression huile bar">
<input id="temp" type="number" placeholder="Température °C">
<select id="critical"><option>Aucune</option><option>Surveillance</option><option>Majeure</option><option>Critique</option></select>
<input id="anomaly" placeholder="Anomalie (facultatif)">
<button onclick="saveReading()">💾 Enregistrer le relevé</button>
</div>

<div class="card"><h2>📊 Énergie</h2><div id="energy">Sélectionne un groupe.</div></div>
<div class="card"><h2>🔧 Pièce utilisée</h2>
<select id="part"></select><input id="qty" type="number" min="1" value="1">
<button onclick="savePart()">Enregistrer la pièce</button>
<div id="partMsg" class="muted"></div></div>
</main></div>

<script>
const SUPABASE_URL="https://ecxtvzpzbtddrjysfgfs.supabase.co";
const SUPABASE_KEY="sb_publishable_ynlEBWgJwWJ6T402PUDDEQ_s4ZUkb5J";
let token=localStorage.getItem("ge_token"), sites=[], groups=[], runs=[], parts=[];

async function api(path,opt={}) {
  opt.headers=Object.assign({"apikey":SUPABASE_KEY,"Content-Type":"application/json"},opt.headers||{});
  if(token) opt.headers.Authorization="Bearer "+token;
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,opt);
  const text=await r.text(); let data;
  try{data=text?JSON.parse(text):null}catch{data=text}
  if(!r.ok) throw new Error(typeof data==="string"?data:(data?.message||data?.hint||JSON.stringify(data)));
  return data;
}
function showMsg(x){document.getElementById("msg").innerHTML='<div class="error">'+x+'</div>'}
async function login(){
 try{let e=email.value,p=password.value;
 const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p})});
 const d=await r.json(); if(!r.ok) throw Error(d.msg||d.error_description||"Connexion impossible");
 token=d.access_token;localStorage.setItem("ge_token",token); start();
 }catch(e){showMsg(e.message)}
}
async function signup(){
 try{let e=email.value,p=password.value;if(!e||!p)throw Error("Renseigne email et mot de passe.");
 const r=await fetch(SUPABASE_URL+"/auth/v1/signup",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p})});
 const d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||"Création impossible");
 showMsg("Compte créé. Si la confirmation email est activée, confirme ton email puis connecte-toi.");
 }catch(e){showMsg(e.message)}
}
function logout(){localStorage.removeItem("ge_token");location.reload()}
async function start(){
 login.style.display="none";app.style.display="block";
 try{sites=await api("ge_sites?select=id,name&order=name");site.innerHTML=sites.map(x=>`<option value="${x.id}">${x.name}</option>`).join("");
 await loadGroups(); parts=await api("ge_parts?select=id,name&order=name");part.innerHTML=parts.map(x=>`<option value="${x.id}">${x.name}</option>`).join("");
 }catch(e){document.body.insertAdjacentHTML("afterbegin",`<div class="error">${e.message}</div>`)}
}
async function loadGroups(){
 groups=await api("ge_generators?select=id,site_id,name,power_kw&site_id=eq."+site.value+"&order=name");
 group.innerHTML=groups.map(x=>`<option value="${x.id}">${x.name}</option>`).join("");
 await render();
}
async function render(){
 const gid=group.value;if(!gid)return;
 runs=await api("ge_runs?select=*&generator_id=eq."+gid+"&order=started_at.desc&limit=50");
 const active=runs.find(x=>!x.stopped_at);
 if(active){
   const sec=(Date.now()-new Date(active.started_at))/1000, kwh=sec/3600*Number(active.power_kw);
   state.innerHTML=`<div class="metric"><b>🟢 EN MARCHE</b><span>${(sec/3600).toFixed(2)} h</span></div><button class="stop" onclick="stop()">⏹️ ARRÊTER</button>`;
   energy.innerHTML=`<div class="metric"><span>Puissance</span><b>${active.power_kw} kW</b></div><div class="metric"><span>Énergie estimée</span><b>${kwh.toFixed(1)} kWh</b></div>`;
 }else{
   state.innerHTML=`<div class="metric"><b>⚪ ARRÊTÉ</b></div><button onclick="startRun()">▶️ DÉMARRER</button>`;
   const total=runs.reduce((s,x)=>s+Number(x.energy_kwh||0),0);
   energy.innerHTML=`<div class="metric"><span>Énergie historique</span><b>${total.toFixed(1)} kWh</b></div>`;
 }
}
async function startRun(){
 const g=groups.find(x=>x.id===group.value);
 await api("ge_runs",{method:"POST",body:JSON.stringify({generator_id:g.id,technician_id:null,power_kw:g.power_kw})});
 await render();
}
async function stop(){
 const r=runs.find(x=>!x.stopped_at);if(!r)return;
 const stopped=new Date(),dur=(stopped-new Date(r.started_at))/1000,kwh=dur/3600*Number(r.power_kw);
 await api("ge_runs?id=eq."+r.id,{method:"PATCH",body:JSON.stringify({stopped_at:stopped.toISOString(),duration_seconds:Math.round(dur),energy_kwh:kwh})});
 await render();
}
async function saveReading(){
 try{
 const row={generator_id:group.value,technician_id:null,engine_hours:hours.value||null,rpm:rpm.value||null,voltage:voltage.value||null,frequency:freq.value||null,oil_pressure:oil.value||null,temperature:temp.value||null,criticality:critical.value,anomaly:anomaly.value||null};
 await api("ge_readings",{method:"POST",body:JSON.stringify(row)});
 alert("Relevé enregistré.");
 }catch(e){alert(e.message)}
}
async function savePart(){
 try{
 const reading=await api("ge_readings?generator_id=eq."+group.value+"&order=created_at.desc&limit=1");
 if(!reading.length){alert("Enregistre d'abord un relevé.");return}
 await api("ge_used_parts",{method:"POST",body:JSON.stringify({reading_id:reading[0].id,part_id:part.value,quantity:Number(qty.value)||1})});
 partMsg.textContent="Pièce enregistrée.";
 }catch(e){partMsg.textContent=e.message}
}
if(token)start();
</script>
</body></html>
